<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Books</title>
</head>
<body>
    <header>Library</header>
    <button command="show-modal" id="open-btn">Add New Book</button>

    <dialog id="my-dialog">
        <form id="book-form">
            <label>Title <input type="text" name="title" required></label>
            <label>Author <input type="text" name="author" required></label>
            <label>Pages <input type="number" name="pages" required></label>
            <label><input type="checkbox" name="read"> Already read</label>
            <button type="submit" id="add-btn">Add Book</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </form>
    </dialog>

    <template id="book-card-template">
        <div class="bookCard">
            <div class="bookData"></div>
            <label><input type="checkbox" class="readRefresh"> Read book?</label>
            <button class="delete-btn">Remove</button>
        </div>
    </template>

    <div class="container"></div>
    <script src="main.js"></script>
</body>
</html>
